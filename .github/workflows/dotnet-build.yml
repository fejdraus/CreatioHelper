name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore CreatioHelper.sln
      - name: Build
        run: dotnet build CreatioHelper.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test CreatioHelper.sln --no-build --configuration Release --blame-hang-timeout 60s
        timeout-minutes: 10
      # Verifies code formatting matches .editorconfig + default dotnet format rules.
      # Currently reports existing whitespace violations in src/CreatioHelper.Shared/Utils/*
      # and src/CreatioHelper.Contracts/Requests/* — do NOT remove `continue-on-error: true`
      # until those files are reformatted (run `dotnet format` locally and commit the result).
      - name: Verify formatting
        run: dotnet format CreatioHelper.sln --verify-no-changes --no-restore
        continue-on-error: true
        timeout-minutes: 10
